services:
  - type: web
    name: ecommerce-backend
    env: php
    region: oregon
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader
    postBuildCommand: php artisan migrate --seed
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /tmp/database.sqlite